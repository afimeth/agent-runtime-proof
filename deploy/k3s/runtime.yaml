# LAB ONLY: ephemeral Redis/Qdrant; no ingress, auth or durable volumes.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-proof
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: agent-proof}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: agent-proof}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: qdrant, namespace: agent-proof}
spec:
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:v1.12.5
        ports: [{containerPort: 6333}]
---
apiVersion: v1
kind: Service
metadata: {name: qdrant, namespace: agent-proof}
spec:
  selector: {app: qdrant}
  ports: [{port: 6333}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: agent-proof}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: ghcr.io/afimeth/agent-runtime-proof:latest # Build and publish explicitly before applying
        ports: [{containerPort: 8000}]
        env:
        - {name: REDIS_URL, value: "redis://redis:6379/0"}
        - {name: QDRANT_URL, value: "http://qdrant:6333"}
        readinessProbe:
          httpGet: {path: /health/ready, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: agent-proof}
spec:
  selector: {app: api}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: agent-proof}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - name: worker
        image: ghcr.io/afimeth/agent-runtime-proof:latest
        command: ["python","-m","app.worker"]
        env:
        - {name: REDIS_URL, value: "redis://redis:6379/0"}
